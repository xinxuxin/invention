[project]
name = "data-analysis-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the Data Analysis Agent take-home project."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlmodel>=0.0.19",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "cloudpickle>=3.0.0",
  "openai>=1.30.0",
  "python-multipart>=0.0.9",
  "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
